services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bulk-discount-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/data/dev.sqlite
    volumes:
      # Map persistent database directory on Block Storage volume (/mnt/app_extend_storage)
      - /mnt/app_extend_storage/data/bulk-discount:/app/prisma/data
